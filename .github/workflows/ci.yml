name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: blog
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d blog"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: mongodb://127.0.0.1:27017/blog?directConnection=true&retryWrites=true&w=majority
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/blog?schema=public
      NEXTAUTH_SECRET: playwright-test-secret-only
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Validate PostgreSQL production schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/blog?schema=public
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/blog?schema=public
        run: npx prisma validate --schema=prisma/postgresql/schema.prisma

      - name: Build application
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
